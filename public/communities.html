<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comunidades • Junto.fm</title>
<script src="/theme-bridge.js?v=1"></script>
<link rel="stylesheet" href="/community-classics.css?v=1">
<script defer src="/community-classics.js?v=1"></script>
</head>
<body>
<header><a href="/">← Junto.fm</a><span>COMUNIDADES</span></header>
<main>
<section class="hero"><p class="eyebrow">OS MACACOS SE REÚNEM.</p><h1>Comunidades</h1><p>Encontre gente que curte as mesmas coisas. Crie seu canto e reúna seu bando.</p></section>
<section class="panel create"><h2>✚ Criar comunidade</h2><form id="createCommunity"><label>Nome <input id="communityName" maxlength="60" minlength="3" required placeholder="Ex.: Macacos do Rock"></label><label>Descrição <textarea id="communityDescription" maxlength="280" rows="3" placeholder="Sobre o que é sua comunidade?"></textarea></label><button class="btn" type="submit">Criar comunidade</button><p id="createStatus" role="status"></p></form></section>
<section class="panel"><div class="list-head"><h2>✦ Comunidades da Junto</h2><button id="reload" class="btn secondary" type="button">Atualizar</button></div><p id="listStatus" role="status">Carregando...</p><div id="communities" class="communities"></div></section>
</main><footer>FEITO PELOS MACACOS. PARA OS MACACOS.</footer>
</body></html>
