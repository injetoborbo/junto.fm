<style>

</style><main><header><strong>junto.fm</strong><small>PRÉVIA LOCAL</small></header><h1>Recepção do clube</h1><div class="grid"><section class="scene"><canvas width="320" height="206" aria-label="Recepção isométrica com DJ macaco, balcão de discos e a porta neon do The Símios"></canvas></section><section class="rooms"><h2>Salas abertas</h2><div class="room"><b><i class="light"></i>Sala do DJ</b><span>DJ Macaco · 3 ouvintes</span><button data-room="dj">Entrar</button></div><div class="room"><b><i class="light off"></i>Sala vazia</b><span>0 ouvintes · sem transmissão</span><button data-room="empty">Entrar</button></div></section></div><section class="deck"><div class="speaker"></div><div class="lcd" aria-live="polite"><small id="status">RECEPTOR FM · EM ESPERA</small><b id="track">Escolha uma sala</b></div><button id="sound" disabled>Ouvir</button></section><footer>Salas simuladas para testar o visual. A sala do DJ toca um loop de demonstração.</footer></main>
<script>
const c=document.querySelector('canvas').getContext('2d');function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}function poly(points,col){c.fillStyle=col;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill()}
function tile(x,y,w,d,top){poly([[x,y],[x+w,y+w/2],[x+w-d,y+(w+d)/2],[x-d,y+d/2]],top)}
function box(x,y,w,d,h,t,l,r){tile(x,y-h,w,d,t);poly([[x-d,y+d/2-h],[x+w-d,y+(w+d)/2-h],[x+w-d,y+(w+d)/2],[x-d,y+d/2]],l);poly([[x+w,y+w/2-h],[x+w-d,y+(w+d)/2-h],[x+w-d,y+(w+d)/2],[x+w,y+w/2]],r)}
rect(0,0,320,206,'#211f31');box(155,54,144,128,6,'#795d65','#463547','#352c40');for(let i=0;i<9;i++)for(let j=0;j<8;j++)tile(155+16*(i-j),48+8*(i+j),15,15,(i+j)%2?'#a38683':'#c39e8e');
for(let j=0;j<8;j++)for(let k=0;k<5;k++){box(155-16*j,48+8*j-9*k,3,16,9,k===4?'#ecc291':'#936b69',(j+k)%2?'#99706c':'#a67971','#835d62')}
for(let i=0;i<9;i++)for(let k=0;k<5;k++)box(155+16*i,48+8*i-9*k,16,3,9,'#dfb78b','#846169',(i+k)%2?'#8e6570':'#815d68');
function sign(x,y,label,color){const w=label.length*6+9;rect(x+2,y+2,w,15,'#4a364b');rect(x,y,w,15,'#241f32');rect(x+2,y+2,w-4,1,color);c.fillStyle=color;c.font='bold 10px monospace';c.fillText(label,x+4,y+12)}sign(82,32,'JUNTO.FM','#ffce81');
poly([[206,52],[235,66],[235,88],[206,74]],'#282a40');poly([[209,55],[232,66],[232,86],[209,75]],'#45405d');rect(228,73,2,3,'#ffbf75');sign(192,42,'THE SÍMIOS','#ff9cbb');
function speaker(x,y){box(x,y,10,9,21,'#584b55','#342f42','#241f31');rect(x-6,y-14,6,6,'#b18978');rect(x-5,y-13,4,4,'#282532');rect(x-4,y-5,4,3,'#a78175')}speaker(82,98);speaker(177,116);
function monkey(x,y){rect(x-6,y+6,13,13,'#476977');rect(x-7,y-6,15,13,'#64473e');rect(x-10,y-3,4,5,'#b98262');rect(x+7,y-3,4,5,'#b98262');rect(x-5,y-3,11,6,'#e5ab80');rect(x-4,y+1,10,5,'#ce956c');rect(x-3,y-2,2,2,'#251f2a');rect(x+3,y-2,2,2,'#251f2a');rect(x-6,y-8,13,2,'#292737');rect(x-8,y-6,2,7,'#e2b558');rect(x+7,y-6,2,7,'#e2b558')}monkey(123,86);
box(105,95,53,17,10,'#dcac7b','#86605c','#685057');box(106,96,51,16,3,'#e7bd87','#b97e66','#845a59');for(const x of [111,132]){let y=92+(x-111)/2;tile(x,y,12,10,'#353240');tile(x+1,y+3,5,5,'#706474');rect(x,y+5,2,2,'#fbcb82')}
for(const [x,y] of [[72,126],[163,147],[240,117]]){box(x,y,9,9,9,'#dfaa75','#a06d5b','#76505a');for(const [dx,dy] of [[-5,-14],[2,-18],[-1,-20],[4,-12]])rect(x+dx,y+dy,4,9,dx>0?'#80a27c':'#567b68')}
let room='',audio,timer,step=0;const notes=[130.81,0,196,0,155.56,233.08,196,0];const sound=document.querySelector('#sound'),statusEl=document.querySelector('#status'),track=document.querySelector('#track');function stop(){clearInterval(timer);timer=null;if(audio){audio.close();audio=null}sound.textContent='Ouvir'}function play(){audio=new AudioContext();audio.resume();function tick(){const f=notes[step++%notes.length];if(!f)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.014);g.gain.exponentialRampToValueAtTime(.001,t+.23);o.connect(g).connect(audio.destination);o.start();o.stop(t+.24)}tick();timer=setInterval(tick,250);sound.textContent='Silenciar'}
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{stop();room=room===b.dataset.room?'':b.dataset.room;document.querySelectorAll('[data-room]').forEach(k=>k.textContent=k.dataset.room===room?'Sair':'Entrar');sound.disabled=room!=='dj';statusEl.textContent=room==='dj'?'● AO VIVO · SALA DO DJ':room?'SALA VAZIA · EM ESPERA':'RECEPTOR FM · EM ESPERA';track.textContent=room==='dj'?'DJ Macaco — Fita 01':room?'Aguardando transmissão':'Escolha uma sala'});sound.onclick=()=>timer?stop():play();window.addEventListener('pagehide',stop);
</script></html>
